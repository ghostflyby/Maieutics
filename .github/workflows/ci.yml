name: CI

on:
  workflow_dispatch:
    inputs:
      extension_repeat:
        description: "Editor suites per cold macOS worker"
        required: false
        default: "1"

permissions:
  contents: read

jobs:
  extension:
    name: Extension (${{ matrix.os }}, cold ${{ matrix.trial }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26
        trial: [1, 2, 3, 4, 5, 6]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
          # Built-in Deno module cache: key = job + OS/arch + hash of **/deno.lock.
          cache: true

      # test:vscode resolves or downloads VS Code stable through npm:@vscode/test-electron
      # into deno/maieutics-vscode/.vscode-test — cache it per OS so only the first run pays.
      - name: Cache VS Code stable download
        uses: actions/cache@v6
        with:
          path: deno/maieutics-vscode/.vscode-test
          key: ${{ runner.os }}-vscode-stable

      - name: Build extension
        run: deno task --config deno/maieutics-vscode/deno.json build

      - name: Build test bundle
        run: deno task --config deno/maieutics-vscode/deno.json build:test

      # Electron needs a display server: wrap with xvfb on Linux, macOS runs headed directly.
      - name: Test in VS Code
        shell: bash
        env:
          MAIEUTICS_VSCODE_DIAGNOSTICS_DIR: ${{ github.workspace }}/extension-test-logs
          MAIEUTICS_VSCODE_TIMEOUT_MS: "120000"
          EXTENSION_REPEATS: ${{ inputs.extension_repeat || '1' }}
        run: |
          if ! [[ "$EXTENSION_REPEATS" =~ ^([1-9]|1[0-9]|20)$ ]]; then
            echo "extension_repeat must be an integer from 1 to 20" >&2
            exit 1
          fi
          diagnostics_root="$MAIEUTICS_VSCODE_DIAGNOSTICS_DIR"
          for pass in $(seq 1 "$EXTENSION_REPEATS"); do
            echo "Extension test pass $pass/$EXTENSION_REPEATS"
            export MAIEUTICS_VSCODE_DIAGNOSTICS_DIR="$diagnostics_root/pass-$pass"
            if [ "$RUNNER_OS" = "Linux" ]
            then
              xvfb-run -a deno task --config deno/maieutics-vscode/deno.json test:vscode
            else
              deno task --config deno/maieutics-vscode/deno.json test:vscode
            fi
          done

      - name: Upload VS Code diagnostics
        if: failure() || github.event_name == 'schedule'
        uses: actions/upload-artifact@v7
        with:
          name: extension-test-logs-${{ matrix.os }}-${{ matrix.trial }}
          path: extension-test-logs/
          if-no-files-found: warn
          retention-days: 14
